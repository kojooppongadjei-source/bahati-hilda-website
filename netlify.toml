[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/insights/:slug"
  to = "/post.html"
  status = 200

[[redirects]]
  from = "/site-admin"
  to = "/site-admin.html"
  status = 200

# Short link for flyers and QR codes
[[redirects]]
  from = "/glory"
  to = "/glory-blueprint-2027/"
  status = 301
