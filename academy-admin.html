<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academy Registrations | Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body{background:var(--white-dim);}
  .admin-wrap{max-width:1180px;margin:0 auto;padding:48px 24px 90px;}
  .admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:32px;}
  .admin-header h1{font-family:var(--serif);font-size:28px;color:var(--ink);}
  .admin-stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:28px;}
  .admin-stat{background:var(--white);border-radius:10px;padding:16px 22px;min-width:150px;box-shadow:0 4px 14px rgba(0,0,0,0.04);}
  .admin-stat .num{font-size:24px;font-weight:800;color:var(--ink);}
  .admin-stat .label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}

  .admin-table-wrap{background:var(--white);border-radius:12px;overflow-x:auto;box-shadow:0 4px 14px rgba(0,0,0,0.04);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:920px;}
  th{background:var(--ink);color:var(--white);text-align:left;padding:12px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;}
  td{padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--white-dim);}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
  .badge-full{background:#E4F5E9;color:#2F6B47;}
  .badge-installment{background:#FDF0EC;color:var(--wine-deep);}
  .badge-source{background:var(--white-dim);color:var(--ink-soft);font-weight:600;}

  #admin-login{max-width:360px;margin:120px auto;text-align:center;}
  #admin-login h1{font-family:var(--serif);font-size:24px;margin-bottom:20px;}
  #admin-login input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;margin-bottom:14px;}
  #admin-login button{width:100%;padding:13px;background:var(--gold);border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;}
  #admin-login button:hover{background:var(--gold-soft);}
  #admin-login .err{color:var(--wine);font-size:13px;margin-top:10px;}
  #admin-content{display:none;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .refresh-btn{background:var(--ink);color:var(--white);border:none;padding:10px 18px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  .refresh-btn:hover{opacity:.85;}
</style>
</head>
<body>

<div id="admin-login">
  <h1>Academy Registrations</h1>
  <input type="password" id="admin-password-input" placeholder="Enter admin password">
  <button onclick="adminLogin()">View Registrations</button>
  <div class="err" id="admin-login-err"></div>
</div>

<div id="admin-content">
  <div class="admin-wrap">
    <div class="admin-header">
      <h1>Academy Registrations</h1>
      <button class="refresh-btn" onclick="loadRegistrations()">Refresh</button>
    </div>

    <div class="admin-stats" id="admin-stats"></div>

    <div class="admin-table-wrap">
      <table id="admin-table" style="display:none;">
        <thead>
          <tr>
            <th>Registered</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Source</th>
            <th>Plan</th>
            <th>Amount Paid</th>
            <th>Balance Owed</th>
            <th>Status</th>
            <th>Reference</th>
          </tr>
        </thead>
        <tbody id="admin-table-body"></tbody>
      </table>
      <div class="empty-state" id="admin-empty" style="display:none;">No registrations yet.</div>
    </div>
  </div>
</div>

<script>
const ADMIN_PW_KEY = 'bhs_admin_pw';

function adminLogin(){
  const pw = document.getElementById('admin-password-input').value;
  if (!pw) return;
  sessionStorage.setItem(ADMIN_PW_KEY, pw);
  loadRegistrations();
}

async function loadRegistrations(){
  const pw = sessionStorage.getItem(ADMIN_PW_KEY);
  if (!pw) return;

  try {
    const res = await fetch('/.netlify/functions/list-registrations', {
      headers: { 'x-admin-password': pw }
    });

    if (res.status === 401) {
      document.getElementById('admin-login-err').textContent = 'Incorrect password.';
      sessionStorage.removeItem(ADMIN_PW_KEY);
      return;
    }

    if (!res.ok) {
      document.getElementById('admin-login-err').textContent = 'Could not load registrations. Please try again.';
      return;
    }

    const data = await res.json();
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-content').style.display = 'block';
    renderRegistrations(data.registrations || []);
  } catch (err) {
    document.getElementById('admin-login-err').textContent = 'Network error. Please try again.';
  }
}

function renderRegistrations(records){
  const statsEl = document.getElementById('admin-stats');
  const tableEl = document.getElementById('admin-table');
  const bodyEl = document.getElementById('admin-table-body');
  const emptyEl = document.getElementById('admin-empty');

  if (records.length === 0) {
    tableEl.style.display = 'none';
    emptyEl.style.display = 'block';
    statsEl.innerHTML = '';
    return;
  }

  tableEl.style.display = 'table';
  emptyEl.style.display = 'none';

  const totalRegistrations = records.length;
  const totalCollected = records.reduce((sum, r) => sum + (r.amount || 0), 0);
  const totalOwed = records.reduce((sum, r) => sum + (r.balance_owed || 0), 0);
  const fullPayCount = records.filter(r => r.plan === 'full').length;

  statsEl.innerHTML = `
    <div class="admin-stat"><div class="num">${totalRegistrations}</div><div class="label">Registrations</div></div>
    <div class="admin-stat"><div class="num">UGX ${totalCollected.toLocaleString('en-UG')}</div><div class="label">Collected</div></div>
    <div class="admin-stat"><div class="num">UGX ${totalOwed.toLocaleString('en-UG')}</div><div class="label">Balance Owed</div></div>
    <div class="admin-stat"><div class="num">${fullPayCount} / ${totalRegistrations}</div><div class="label">Paid in Full</div></div>
  `;

  bodyEl.innerHTML = records.map(r => {
    const date = r.registered_at ? new Date(r.registered_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
    const planBadge = r.plan === 'full'
      ? '<span class="badge badge-full">Full Payment</span>'
      : '<span class="badge badge-installment">Instalment 1 of 2</span>';
    const balance = r.balance_owed ? `UGX ${Number(r.balance_owed).toLocaleString('en-UG')}` : '—';
    const statusLabel = r.status === 'successful' ? '✅ Paid' : (r.status || '—');

    return `
      <tr>
        <td>${date}</td>
        <td>${escapeHtml(r.name)}</td>
        <td>${escapeHtml(r.email)}</td>
        <td>${escapeHtml(r.phone)}</td>
        <td><span class="badge badge-source">${escapeHtml(r.source || 'Not specified')}</span></td>
        <td>${planBadge}</td>
        <td>${r.currency || 'UGX'} ${Number(r.amount || 0).toLocaleString('en-UG')}</td>
        <td>${balance}</td>
        <td>${statusLabel}</td>
        <td style="font-family:monospace;font-size:12px;">${escapeHtml(r.tx_ref)}</td>
      </tr>
    `;
  }).join('');
}

function escapeHtml(str){
  if (str === undefined || str === null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Auto-load if a password is already saved for this browser session.
(function(){
  if (sessionStorage.getItem(ADMIN_PW_KEY)) {
    loadRegistrations();
  }
})();

document.getElementById('admin-password-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter') adminLogin();
});
</script>

</body>
</html>
